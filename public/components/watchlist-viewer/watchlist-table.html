<div class="panel-header">
    <div class="panel-icon">
        <i class="bi bi-eye"></i>
    </div>
    <div class="panel-title">Watch List</div>
    <div class="panel-ctrl">
        <button class="btn-ctrl"><i class="bi bi-trash"></i></button>
    </div>
</div>

<div class="panel-content panel-content--flush">
    <table id="watchlist-table" class="steel-table">
        <thead id="watchlist-table-header">
            <tr>
                <th style="text-align: left;">Ticker</th>
                <th>Price</th>
                <th>Change</th>
                <th>% Chg</th>
                <th>Rating</th>
                <th>Cap (B)</th>
                <th>P/E</th>
            </tr>
        </thead>

        <tbody id="watchlist-table-body">
            <!-- Data rows will be injected here -->
        </tbody>
    </table>
</div>
<div class="panel-footer">
    <span id="watchlist-count" class="text-muted" style="font-size: 0.7rem;">0 items</span>
</div>
