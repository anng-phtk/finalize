<div class="panel">

    <div class="panel-header">
        <div class="panel-icon">
            <i class="bi bi-columns-gap"></i>
        </div>
        <div class="panel-title">Peer Comparison (10-K)</div>
    </div>

    <div class="panel-content panel-content--flush">
        <table id="comparison-table" class="steel-table">
            <thead>
                <tr id="comp-ticker-row">
                    <th class="metric-col">Ticker</th>
                    <!-- Tickers will be injected here -->
                </tr>
                <tr id="comp-form-row">
                    <th class="metric-col">Form</th>
                    <!-- Forms will be injected here -->
                </tr>
                <tr id="comp-header-row">
                    <th class="metric-col">Metric</th>
                    <!-- Periods will be injected here -->
                </tr>
            </thead>

            <tbody id="comp-table-body">
                <!-- Data rows will be injected here -->
            </tbody>
        </table>
    </div>
</div>
