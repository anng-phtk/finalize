<div class="panel flex-grow">
    <div class="panel-header">
        <div class="panel-icon">
            <i class="bi bi-file-earmark-text"></i>
        </div>
        <div class="panel-title">SEC Filings</div>
        <div class="panel-ctrl">
            <!-- placeholder for controls -->
        </div>
    </div>

    <div class="panel-content panel-content--flush">
        <table id="filings-table" class="steel-table">
            <thead id="filings-table-header">
                <tr>
                    <th style="text-align: left;">Form</th>
                    <th>Date</th>
                    <th>Doc</th>
                </tr>
            </thead>
            <tbody id="filings-table-body">
                <!-- Data rows will be injected here -->
            </tbody>
        </table>
    </div>
    <div class="panel-footer">
        <span id="filings-count" class="text-muted" style="font-size: 0.7rem;">0 filings</span>
    </div>
</div>
