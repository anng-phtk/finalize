<div class="panel">
    <div class="panel-header">
        <div class="panel-icon">
            <i class="bi bi-eye"></i>
        </div>
        <div class="panel-title">Fundamentals Table</div>
        <div class="panel-ctrl">
            <button id="btn-export-tsv" class="btn-ctrl" title="Copy CSV"><i class="bi bi-clipboard-data"></i></button>
            <button id="btn-export-csv" class="btn-ctrl" title="Export CSV"><i class="bi bi-filetype-csv"></i></button>
            <button id="btn-export-xlsx" class="btn-ctrl" title="Export Excel"><i class="bi bi-file-spreadsheet"></i></button>
            <button class="btn-ctrl"><i class="bi bi-trash"></i></button>
        </div>
    </div>

    <div class="panel-content panel-content--flush">
        <table id="fundamentals-table" class="steel-table">
            <thead>
                <tr id="table-form-row">
                    <th class="metric-col">Form</th>
                    <!-- Forms will be injected here -->
                </tr>
                <tr id="table-header-row">
                    <th class="metric-col">Metric</th>
                    <!-- Periods will be injected here -->
                </tr>
            </thead>

            <tbody id="table-body">
                <!-- Data rows will be injected here -->
            </tbody>
        </table>
    </div>
    <div class="panel-footer">
        <span id="table-ticker" class="title-text">Ticker</span>
        <span id="table-reportType" class="title-subtext">Report Type</span>
    </div>
</div>
