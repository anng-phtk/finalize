<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/steel-frame.core.css" />
    <link rel="stylesheet" href="/css/sf-collapse.css" />
    <link rel="stylesheet" href="/css/sf-modal.css" />
    <link rel="stylesheet" href="/css/fundamentals-table.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <title>finalize</title>
</head>

<body>
    <div id="app-grid" class="grid">
        <!-- header -->
        <div class="layout-header">
            <div id="toolbar-container"></div>
            <div id="toast-container" class="toast-container">Hello</div>
        </div>

        <!-- main -->
        <div id="main-content" class="layout-content app-row">

        </div>
        <!-- left-->
        <div id="main-left" class="layout-left app-col">
            <!-- Left -->
            <div class="pane-title">
                <div class="title-icon">
                    <i class="bi bi-tools"></i>
                </div>
                <div class="title-text">Left</div>
                <div class="title-ctrl">
                    <button id="btn-expand-left">
                        <i class="bi bi-arrows-expand-vertical"></i>
                    </button>

                    <button id="btn-collapse-left">
                        <i class="bi bi-textarea-resize"></i>
                    </button>
                </div>
            </div>
            <div id="watchlist-container" class=" panel flex-grow">

            </div>
            <div id="filings-list-container" class="panel flex-grow">

            </div>
        </div>
        <!-- right -->
        <div id="main-right" class="layout-right app-col">
            <!-- Right -->
            <div class="pane-title">
                <div class="title-icon">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="title-text">Visualizer</div>
                <div class="title-ctrl">

                    <button id="btn-expand-right">
                        <i class="bi bi-arrows-expand-vertical"></i>
                    </button>

                    <button id="btn-collapse-right">
                        <i class="bi bi-textarea-resize"></i>
                    </button>
                </div>
            </div>

            <div id="right-applet-primary" class="app-col flex-grow">
                <!-- Fundamentals Chart -->
            </div>
            <div id="right-applet-secondary" class="app-col flex-grow">
                <!-- Peer Comparison Chart -->
            </div>

        </div>
        <!-- footer -->
        <div id="main-footer" class="layout-footer app-col">
            <!-- Footer -->
            <div class="pane-title">
                <div class="title-icon">
                    <i class="bi clipboard2-data"></i>
                </div>
                <div class="title-text">Intelligence</div>
                <div class="title-ctrl">
                    <button id="btn-collapse-footer">
                        <i class="bi bi-pin-angle"></i>
                    </button>
                </div>
            </div>
            <div id="insights-container" class="app-row flex-grow" style="gap: 2px;">
                <div id="stock-insights-container" class="panel flex-grow"></div>
                <div id="earnings-calendar-container" class="panel flex-grow"></div>
                <div id="price-action-container" class="panel flex-grow"></div>
            </div>
            <div id="valuation-container" class="app-row flex-grow" style="gap: 2px;">
                <div id="valuation-stage-container" class="panel flex-grow">test</div>
            </div>
        </div>
    </div>
    </div>

    <!-- Filings Reader Modal -->
    <div id="filings-modal" class="modal-overlay hidden">
        <div id="filings-reader-container" class="modal-content">
        </div>
    </div>

    <!-- Price History Modal -->
    <div id="price-history-modal" class="modal-overlay hidden">
        <div id="price-history-container" class="modal-content">
        </div>
    </div>

    <!-- HTML to write -->
    <a href="#" data-bs-toggle="tooltip" data-bs-title="Some tooltip text!">Hover over me</a>

    <script type="module" src="/src/core/App.ts"></script>

</html>
